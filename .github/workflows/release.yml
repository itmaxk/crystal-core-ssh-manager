name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Версия CLI должна совпадать с github.com/wailsapp/wails/v2 в go.mod.
  WAILS_VERSION: v2.17.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: crystal-core-ssh-manager-windows-amd64
            build_tags: ""
          - os: macos-latest
            platform: darwin/universal
            artifact_name: crystal-core-ssh-manager-macos-universal
            build_tags: ""
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact_name: crystal-core-ssh-manager-linux-amd64
            # В Ubuntu 24.04 есть только WebKitGTK 4.1.
            build_tags: webkit2_41

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Go tests
        run: go test ./...

      - name: Build Wails app
        run: |
          TAGS=()
          if [ -n "${{ matrix.build_tags }}" ]; then TAGS=(-tags "${{ matrix.build_tags }}"); fi
          wails build -clean -platform ${{ matrix.platform }} "${TAGS[@]}"

      - name: Build Windows CLI wrapper (console subsystem)
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-s -w" -o build/bin/ssh-launcher-cli.exe ./cmd/ssh-launcher-cli

      - name: Package
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              7z a "dist/${{ matrix.artifact_name }}.zip" ./build/bin/CrystalCoreSSHManager.exe ./build/bin/ssh-launcher-cli.exe ;;
            macOS)
              ditto -c -k --keepParent build/bin/crystal-core-ssh-manager.app "dist/${{ matrix.artifact_name }}.zip" ;;
            Linux)
              tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C build/bin CrystalCoreSSHManager ;;
          esac
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
              --title "Crystal-Core SSH Manager $TAG" --generate-notes
          fi
